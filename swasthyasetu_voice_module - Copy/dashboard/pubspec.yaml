name: swasthyasetu_admin_dashboard
description: SwasthyaSetu admin dashboard — call/alert/referral observability (Flutter web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.3
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

