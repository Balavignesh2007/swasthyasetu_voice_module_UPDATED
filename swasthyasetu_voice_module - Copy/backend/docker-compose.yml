version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swasthyasetu
      POSTGRES_PASSWORD: swasthyasetu
      POSTGRES_DB: swasthyasetu
    ports:
      - "5432:5432"
    volumes:
      - swasthyasetu_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://swasthyasetu:swasthyasetu@db:5432/swasthyasetu
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  swasthyasetu_pgdata:
